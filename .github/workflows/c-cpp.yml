name: Build Aseprite v1.0.0 (Linux)

on:
  push:
    tags:
      - 'v1.0.0'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: v1.0.0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            g++ cmake ninja-build \
            libx11-dev libxcursor-dev

      - name: Patch Allegro alcompat.h (disable fixed-point aliases in C++ mode)
        run: |
          python3 - <<'EOF'
          path = "src/allegro/include/allegro/alcompat.h"
          with open(path) as f:
              content = f.read()
          old = content

          first = "AL_ALIAS(fixed fadd(fixed x, fixed y), fixadd(x, y))"
          last  = "AL_ALIAS(fixed fsqrt(fixed x), fixsqrt(x))"

          if first not in content or last not in content:
              raise SystemExit("Expected AL_ALIAS lines not found — dump file content to debug")

          content = content.replace(first, "#ifndef __cplusplus\n" + first)
          content = content.replace(last, last + "\n#endif")

          if content == old:
              raise SystemExit("No changes applied")

          with open(path, "w") as f:
              f.write(content)

          print("Patch applied: wrapped fadd..fsqrt aliases in #ifndef __cplusplus")
          EOF

      - name: Configure CMake
        run: |
          mkdir -p build
          cd build
          cmake -G Ninja -DCMAKE_BUILD_TYPE=Release ..

      - name: Build
        run: |
          cd build
          ninja aseprite

      - name: Package build
        run: |
          mkdir -p artifact
          cp -r build/bin/* artifact/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: aseprite-linux-v1.0.0
          path: artifact/
