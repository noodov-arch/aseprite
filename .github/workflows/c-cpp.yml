name: Build Aseprite v1.0.0 (Linux, legacy container)

on:
  push:
    tags:
      - 'v1.0.0'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: v1.0.0

      - name: Build inside Ubuntu 16.04 container
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/work" \
            -w /work \
            ubuntu:16.04 \
            bash -c "
              set -e
              apt-get update
              apt-get install -y \
                g++ make cmake git \
                libx11-dev libxcursor-dev \
                libfreetype6-dev libpng-dev libjpeg-dev zlib1g-dev \
                libgif-dev libtiff-dev

              mkdir -p build
              cd build

              echo '=== Running CMake ==='
              cmake -DCMAKE_BUILD_TYPE=Release .. || { echo '--- CMakeError.log ---'; cat CMakeFiles/CMakeError.log 2>/dev/null; exit 1; }

              echo '=== Running make ==='
              make aseprite -j\$(nproc) 2>&1 | tee build.log
              BUILD_EXIT=\${PIPESTATUS[0]}

              if [ \$BUILD_EXIT -ne 0 ]; then
                echo '--- Build failed, last 150 lines of log ---'
                tail -150 build.log
                exit 1
              fi

              test -f bin/aseprite || { echo 'ERROR: binary bin/aseprite not found after successful make'; ls -la bin/ 2>/dev/null; exit 1; }
              echo '=== Build succeeded, binary present ==='
            "

      - name: Package build
        run: |
          mkdir -p artifact
          cp -r build/bin/* artifact/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: aseprite-linux-v1.0.0
          path: artifact/
