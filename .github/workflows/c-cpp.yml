name: Build Aseprite v1.0.0 (Linux)

on:
  push:
    tags:
      - 'v1.0.0'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-20.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: v1.0.0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            g++ cmake ninja-build \
            libx11-dev libxcursor-dev

      - name: Configure CMake
        run: |
          mkdir -p build
          cd build
          cmake -G Ninja -DCMAKE_BUILD_TYPE=Release ..

      - name: Build
        run: |
          cd build
          ninja aseprite

      - name: Package build
        run: |
          mkdir -p artifact
          cp -r build/bin/* artifact/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: aseprite-linux-v1.0.0
          path: artifact/
