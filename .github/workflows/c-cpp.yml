name: Build Aseprite v1.0.0 (Linux)

on:
  push:
    tags:
      - 'v1.0.0'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: v1.0.0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            g++ cmake ninja-build \
            libx11-dev libxcursor-dev

      - name: Patch Allegro alcompat.h (fix fadd/fsub/fmul/fdiv/fsqrt conflict)
        run: |
          python3 - <<'EOF'
          path = "src/allegro/include/allegro/alcompat.h"
          with open(path) as f:
              content = f.read()
          old = content

          replacements = [
              ("AL_ALIAS(fixed fadd(fixed x, fixed y), fixadd(x, y))",
               "#if !defined(fadd)\nAL_ALIAS(fixed fadd(fixed x, fixed y), fixadd(x, y))\n#endif"),
              ("AL_ALIAS(fixed fsub(fixed x, fixed y), fixsub(x, y))",
               "#if !defined(fsub)\nAL_ALIAS(fixed fsub(fixed x, fixed y), fixsub(x, y))\n#endif"),
              ("AL_ALIAS(fixed fmul(fixed x, fixed y), fixmul(x, y))",
               "#if !defined(fmul)\nAL_ALIAS(fixed fmul(fixed x, fixed y), fixmul(x, y))\n#endif"),
              ("AL_ALIAS(fixed fdiv(fixed x, fixed y), fixdiv(x, y))",
               "#if !defined(fdiv)\nAL_ALIAS(fixed fdiv(fixed x, fixed y), fixdiv(x, y))\n#endif"),
              ("AL_ALIAS(fixed fsqrt(fixed x), fixsqrt(x))",
               "#if !defined(fsqrt)\nAL_ALIAS(fixed fsqrt(fixed x), fixsqrt(x))\n#endif"),
          ]

          for old_str, new_str in replacements:
              if old_str in content:
                  content = content.replace(old_str, new_str)
              else:
                  print(f"WARNING: pattern not found: {old_str}")

          if content == old:
              raise SystemExit("No patterns matched — check exact text in alcompat.h")

          with open(path, "w") as f:
              f.write(content)

          print("Patch applied successfully.")
          EOF

      - name: Configure CMake
        run: |
          mkdir -p build
          cd build
          cmake -G Ninja -DCMAKE_BUILD_TYPE=Release ..

      - name: Build
        run: |
          cd build
          ninja aseprite

      - name: Package build
        run: |
          mkdir -p artifact
          cp -r build/bin/* artifact/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: aseprite-linux-v1.0.0
          path: artifact/
