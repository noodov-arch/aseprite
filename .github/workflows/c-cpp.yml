name: Build Aseprite v1.0.0 (Linux, legacy container)

on:
  push:
    tags:
      - 'v1.0.0'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: v1.0.0

      - name: Build inside Ubuntu 16.04 container
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/work" \
            -w /work \
            ubuntu:16.04 \
            bash -c "
              set -e
              apt-get update
              apt-get install -y g++ make cmake git libx11-dev libxcursor-dev
              mkdir -p build
              cd build
              cmake -DCMAKE_BUILD_TYPE=Release ..
              make aseprite -j\$(nproc)
            "

      - name: Package build
        run: |
          mkdir -p artifact
          cp -r build/bin/* artifact/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: aseprite-linux-v1.0.0
          path: artifact/
